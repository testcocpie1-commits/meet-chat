<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>遇见 · 匿名聊天</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">遇见<span data-i="brandNote"></span></a><div class="header-right"><span class="live" id="online"></span><button id="lang">繁體中文</button></div></header><main><section class="panel"><div class="panel-head"><div><span class="dot"></span><strong id="status"></strong></div><button id="report" class="quiet" data-i="report" disabled></button></div><div id="setup"><fieldset><legend data-i="gender"></legend><label><input type="radio" name="gender" value="male" checked><span data-i="male"></span></label><label><input type="radio" name="gender" value="female"><span data-i="female"></span></label></fieldset><fieldset><legend data-i="mode"></legend><label><input type="radio" name="mode" value="random" checked><span data-i="random"></span></label><label><input type="radio" name="mode" value="opposite"><span data-i="opposite"></span></label></fieldset><label class="field"><span data-i="phrase"></span><input id="phrase" maxlength="64" autocomplete="off"></label><label class="consent"><input id="consent" type="checkbox"><span data-i="consent"></span></label><button id="join" class="primary" data-i="start"></button></div><div id="conversation" hidden><div id="messages" aria-live="polite"></div><div id="reply" hidden><span></span><button id="cancelReply" aria-label="取消引用">×</button></div><form id="composer"><div id="emojis"></div><div class="send-row"><textarea id="text" rows="2" maxlength="1000"></textarea><button id="send" class="primary" data-i="send"></button></div></form><div class="chat-actions"><button id="leave" data-i="leave"></button><button id="again" data-i="again" hidden></button><span class="muted" data-i="replyHint"></span></div></div><div id="error" role="alert"></div><div class="ad" id="ad" hidden><small data-i="ad"></small><span d
